name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: matlab-actions/setup-matlab@v3

      # Put the library on the path before discovery, and only scan tests/,
      # so the block subclasses aren't reported as broken test files.
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); results = runtests("tests"); disp(results); assertSuccess(results);
